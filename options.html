<!DOCTYPE html>
<html>
<head>
  <title>Mindful Blocker Options</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body class="options-body">
  <div class="container">
    <h1>Mindful Blocker</h1>
    <h2>Manage Blocked Sites</h2>
    
    <div class="input-group">
      <input type="text" id="siteInput" placeholder="example.com">
      <label class="checkbox-container">
        <input type="checkbox" id="allowSubroutes">
        <span>Allow subroutes (Block homepage only)</span>
      </label>
      <button id="addBtn">Block Site</button>
    </div>

    <ul id="siteList"></ul>
    
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
